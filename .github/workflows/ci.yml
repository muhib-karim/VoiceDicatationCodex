name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    # WPF (net8.0-windows) builds and runs only on Windows.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore VoiceDictationCodex.sln

      # Directory.Build.props sets TreatWarningsAsErrors for every project.
      - name: Build (warnings are errors)
        run: dotnet build VoiceDictationCodex.sln --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test VoiceDictationCodex.sln --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --blame-hang-timeout 2m

      - name: Coverage summary
        if: always()
        shell: pwsh
        run: |
          $report = Get-ChildItem -Path TestResults -Recurse -Filter coverage.cobertura.xml -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $report) {
            "No coverage report was produced." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          [xml]$xml = Get-Content $report.FullName
          $line = [math]::Round([double]$xml.coverage.'line-rate' * 100, 1)
          $branch = [math]::Round([double]$xml.coverage.'branch-rate' * 100, 1)
          "### Test coverage" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| Metric | Covered |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          "| Lines | $line% |" >> $env:GITHUB_STEP_SUMMARY
          "| Branches | $branch% |" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "Line coverage: $line%  Branch coverage: $branch%"

      # Artifact storage may be full on this account, so a failed upload must not fail the job.
      - name: Upload test results and coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults
          retention-days: 3
          if-no-files-found: warn

  lint:
    name: Format and dependency audit
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore VoiceDictationCodex.sln

      - name: Verify formatting
        run: dotnet format VoiceDictationCodex.sln --verify-no-changes --no-restore

      - name: Fail on vulnerable packages
        if: always()
        shell: pwsh
        run: |
          $output = dotnet list VoiceDictationCodex.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::dotnet list package failed."
            exit 1
          }
          if ($output -match 'has the following vulnerable packages') {
            Write-Host "::error::Vulnerable NuGet packages found."
            exit 1
          }

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf gitleaks.tar.gz -C "${RUNNER_TEMP}/gitleaks" gitleaks
          rm gitleaks.tar.gz

      - name: Scan full history
        run: |
          "${RUNNER_TEMP}/gitleaks/gitleaks" git --no-banner --redact --verbose .
